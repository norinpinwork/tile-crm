<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TileCRM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F4F0;
  --card: #FFFFFF;
  --border: #E8E6E0;
  --border2: #D4D1C8;
  --text: #1C1C1A;
  --text2: #6B6963;
  --text3: #A8A49C;
  --accent: #2D5BE3;
  --accent-bg: #EEF2FD;
  --green: #1A8A5A;
  --green-bg: #E8F7F0;
  --amber: #B86A00;
  --amber-bg: #FEF3E2;
  --red: #C0392B;
  --red-bg: #FDECEA;
  --purple: #6B3FA0;
  --purple-bg: #F3EDFB;
  --nav-h: 60px;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }
button { cursor: pointer; border: none; background: none; font-family: inherit; }
input, textarea, select { font-family: inherit; font-size: 14px; }
a { color: inherit; text-decoration: none; }

/* Layout */
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; background: var(--bg); }
#main { padding: 0 0 calc(var(--nav-h) + 16px); }

/* Bottom Nav */
#nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: var(--card); border-top: 1px solid var(--border);
  display: flex; height: var(--nav-h);
  z-index: 100;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 8px 4px; color: var(--text3); transition: color 0.15s;
  font-size: 10px; font-weight: 500;
}
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Page header */
.page-header {
  padding: 20px 16px 12px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--bg); z-index: 10;
}
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.page-subtitle { font-size: 12px; color: var(--text2); margin-top: 1px; }

/* Buttons */
.btn-primary {
  background: var(--accent); color: #fff; border-radius: var(--radius-sm);
  padding: 10px 18px; font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
  transition: opacity 0.15s;
}
.btn-primary:active { opacity: 0.85; }
.btn-sm {
  padding: 6px 12px; font-size: 12px; border-radius: 6px;
  background: var(--accent-bg); color: var(--accent); font-weight: 500;
}
.btn-icon {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  background: var(--accent); color: #fff;
}
.btn-icon svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Cards */
.card {
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); box-shadow: var(--shadow);
  overflow: hidden;
}
.card-body { padding: 14px 16px; }

/* Tags / Badges */
.badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500;
}
.badge-green { background: var(--green-bg); color: var(--green); }
.badge-amber { background: var(--amber-bg); color: var(--amber); }
.badge-red { background: var(--red-bg); color: var(--red); }
.badge-blue { background: var(--accent-bg); color: var(--accent); }
.badge-purple { background: var(--purple-bg); color: var(--purple); }
.badge-gray { background: #F1EFE8; color: var(--text2); }

/* Section label */
.section-label {
  font-size: 11px; font-weight: 700; color: var(--text3);
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 0 16px; margin-bottom: 8px; margin-top: 20px;
}

/* List items */
.list-item {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  margin: 0 16px 8px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
  box-shadow: var(--shadow);
}
.list-item:active { border-color: var(--border2); box-shadow: var(--shadow-md); }
.list-item-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.list-item-body { flex: 1; min-width: 0; }
.list-item-title { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.list-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.chevron { color: var(--text3); }
.chevron svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

/* Priority stars */
.stars { color: #F5A623; font-size: 11px; letter-spacing: 1px; }

/* Form */
.form-group { margin-bottom: 16px; padding: 0 16px; }
.form-label { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 5px; display: block; }
.form-label span { color: var(--red); margin-left: 2px; }
.form-control {
  width: 100%; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px;
  font-size: 14px; color: var(--text); background: var(--card);
  transition: border-color 0.15s;
  outline: none;
}
.form-control:focus { border-color: var(--accent); }
textarea.form-control { resize: vertical; min-height: 80px; }
.form-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  z-index: 200; display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg); width: 100%; max-width: 480px; max-height: 92vh;
  border-radius: 20px 20px 0 0; overflow-y: auto;
  transform: translateY(30px); transition: transform 0.25s;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-header {
  padding: 16px 16px 8px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--bg); z-index: 1;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close {
  width: 30px; height: 30px; border-radius: 50%; background: var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--text2);
}
.modal-actions { padding: 16px; display: flex; gap: 8px; }
.modal-actions .btn-primary { flex: 1; justify-content: center; }
.btn-cancel { flex: 1; padding: 10px; border-radius: var(--radius-sm); background: var(--border); color: var(--text2); font-size: 14px; font-weight: 500; text-align: center; }

/* Detail page */
.detail-back {
  padding: 16px 16px 8px;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 500;
}
.detail-back svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.detail-hero { padding: 8px 16px 20px; }
.detail-hero-icon { font-size: 40px; margin-bottom: 10px; }
.detail-hero h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.detail-hero p { font-size: 13px; color: var(--text2); margin-top: 3px; }
.detail-section { padding: 0 16px; margin-bottom: 24px; }
.detail-section-title { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.info-row { display: flex; padding: 9px 0; border-bottom: 1px solid var(--border); }
.info-row:last-child { border-bottom: none; }
.info-label { width: 90px; font-size: 12px; color: var(--text3); flex-shrink: 0; padding-top: 1px; }
.info-value { flex: 1; font-size: 13px; word-break: break-all; }
.info-value a { color: var(--accent); }

/* Timeline */
.timeline { position: relative; }
.timeline-item { display: flex; gap: 12px; margin-bottom: 16px; position: relative; }
.timeline-dot { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-bg); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; z-index: 1; }
.timeline-line { position: absolute; left: 15px; top: 32px; bottom: -16px; width: 2px; background: var(--border); }
.timeline-content { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; }
.timeline-date { font-size: 11px; color: var(--text3); margin-bottom: 4px; font-family: 'DM Mono', monospace; }
.timeline-text { font-size: 13px; line-height: 1.6; }
.timeline-action { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--accent); }
.timeline-next { font-size: 11px; color: var(--green); font-weight: 500; margin-top: 4px; }

/* AI panel */
.ai-panel {
  background: linear-gradient(135deg, #EEF2FD 0%, #F3EDFB 100%);
  border: 1px solid #C8D4F9; border-radius: var(--radius);
  padding: 14px; margin: 0 16px 16px;
}
.ai-panel-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.ai-badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; letter-spacing: 0.05em; }
.ai-text { font-size: 13px; line-height: 1.7; color: var(--text); }
.ai-loading { color: var(--text3); font-size: 13px; display: flex; align-items: center; gap: 8px; }

/* Dashboard widgets */
.dash-scroll { display: flex; gap: 10px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.dash-scroll::-webkit-scrollbar { display: none; }
.stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; min-width: 130px; flex-shrink: 0;
}
.stat-card .num { font-size: 28px; font-weight: 700; font-family: 'DM Mono', monospace; letter-spacing: -1px; }
.stat-card .label { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* Todo item */
.todo-item {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px 14px; margin: 0 16px 8px;
  display: flex; align-items: flex-start; gap: 10px; cursor: pointer;
  transition: opacity 0.2s;
}
.todo-item.done { opacity: 0.5; }
.todo-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border2); flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.todo-item.done .todo-check { background: var(--green); border-color: var(--green); }
.todo-item.done .todo-check::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 700; }
.todo-body { flex: 1; min-width: 0; }
.todo-title { font-size: 14px; font-weight: 500; }
.todo-item.done .todo-title { text-decoration: line-through; color: var(--text3); }
.todo-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.todo-due { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.todo-due.overdue { color: var(--red); font-weight: 600; }

/* Apo list */
.apo-item {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; margin: 0 16px 8px;
  display: flex; gap: 12px; align-items: flex-start; cursor: pointer;
  transition: border-color 0.15s;
}
.apo-item:active { border-color: var(--border2); }
.apo-rank {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--accent-bg); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; font-family: 'DM Mono', monospace;
  flex-shrink: 0;
}
.apo-body { flex: 1; min-width: 0; }
.apo-company { font-size: 14px; font-weight: 700; }
.apo-address { font-size: 12px; color: var(--text2); margin-top: 2px; }
.apo-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.apo-status { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.apo-note { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* Search bar */
.search-bar {
  margin: 0 16px 12px; position: relative;
}
.search-bar input {
  width: 100%; padding: 10px 12px 10px 36px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  background: var(--card); font-size: 14px; outline: none;
}
.search-bar input:focus { border-color: var(--accent); }
.search-bar-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); }
.search-bar-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

/* Empty state */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); }
.empty-state .icon { font-size: 40px; margin-bottom: 10px; }
.empty-state p { font-size: 14px; }

/* Fab */
.fab {
  position: fixed; bottom: calc(var(--nav-h) + 16px); right: 50%;
  transform: translateX(calc(240px - 28px));
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(45,91,227,0.4);
  z-index: 50; font-size: 24px; transition: transform 0.15s;
}
.fab:active { transform: translateX(calc(240px - 28px)) scale(0.93); }
.fab svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; }
@media (max-width: 480px) {
  .fab { right: 16px; transform: none; }
  .fab:active { transform: scale(0.93); }
}

/* Tabs */
.tabs { display: flex; gap: 4px; padding: 0 16px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 6px 14px; border-radius: 99px; font-size: 13px; font-weight: 500;
  white-space: nowrap; color: var(--text2); background: var(--card);
  border: 1.5px solid var(--border); transition: all 0.15s; cursor: pointer;
}
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Toggle */
.toggle-group { display: flex; gap: 6px; padding: 0 16px; margin-bottom: 10px; }
.toggle-btn { flex: 1; padding: 8px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; text-align: center; cursor: pointer; border: 1.5px solid var(--border); background: var(--card); color: var(--text2); transition: all 0.15s; }
.toggle-btn.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }

/* Dot loader */
@keyframes blink { 0%,100%{opacity:0.2} 50%{opacity:1} }
.dot-loader span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin: 0 2px; animation: blink 1.2s infinite; }
.dot-loader span:nth-child(2) { animation-delay: 0.2s; }
.dot-loader span:nth-child(3) { animation-delay: 0.4s; }

/* Notification dot */
.notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; margin-left: 4px; vertical-align: middle; }

/* Animations */
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.page { animation: fadeIn 0.18s ease; }
</style>
</head>
<body>
<div id="app">
  <div id="main"></div>
  <nav id="nav">
    <button class="nav-btn active" onclick="navigate('dash')" id="nav-dash">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      ホーム
    </button>
    <button class="nav-btn" onclick="navigate('customers')" id="nav-customers">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      顧客
    </button>
    <button class="nav-btn" onclick="navigate('apo')" id="nav-apo">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      新規アポ
    </button>
    <button class="nav-btn" onclick="navigate('visits')" id="nav-visits">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      訪問
    </button>
    <button class="nav-btn" onclick="navigate('todos')" id="nav-todos">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      ToDo
    </button>
  </nav>
</div>

<!-- Modal -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ===== DATA STORE =====
const DB = {
  get(key) { try { return JSON.parse(localStorage.getItem('tilecrm_'+key)) || []; } catch(e) { return []; } },
  set(key, val) { localStorage.setItem('tilecrm_'+key, JSON.stringify(val)); },
  id() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
};

// Seed demo data if empty
function seedData() {
  if (DB.get('customers').length) return;
  const customers = [
    { id: DB.id(), company: '株式会社田中建設', industry: '建設業', contact: '田中 誠', phone: '03-1234-5678', website: 'https://tanaka-const.jp', ai_sheet: '大手ゼネコン案件が多い。タイル外壁の需要あり。', priority: 5, status: '商談中', created_at: new Date().toISOString() },
    { id: DB.id(), company: 'リゾートホテル琉球', industry: 'ホテル・宿泊', contact: '山田 花子', phone: '098-765-4321', website: '', ai_sheet: 'リノベーション計画中。インテリアタイル重視。', priority: 4, status: '見込み', created_at: new Date().toISOString() },
    { id: DB.id(), company: '株式会社フジハウス', industry: '住宅・不動産', contact: '鈴木 太郎', phone: '06-9876-5432', website: 'https://fuji-house.co.jp', ai_sheet: '年間50棟施工。キッチン・バスルームタイル需要。', priority: 3, status: '見込み', created_at: new Date().toISOString() },
  ];
  DB.set('customers', customers);

  const visits = [
    { id: DB.id(), customer_id: customers[0].id, visited_at: '2025-05-08', content: '外壁タイルの新商品カタログを持参。石材調シリーズに興味あり。サンプル請求いただいた。', next_action: 'サンプル送付後、来週フォロー電話', next_visit: '2025-05-20', created_at: new Date().toISOString() },
    { id: DB.id(), customer_id: customers[0].id, visited_at: '2025-04-25', content: '現場視察に同行。外壁の一部がタイル張りの予定とのこと。設計士への提案資料を作成中。', next_action: '設計士向け提案書を作成して送付', next_visit: '2025-05-10', created_at: new Date().toISOString() },
    { id: DB.id(), customer_id: customers[1].id, visited_at: '2025-05-05', content: 'ロビーリノベーションの打合せ。高級感のある大判タイルに興味。予算は150万円前後。', next_action: '大判タイルのサンプルと見積を準備', next_visit: '2025-05-18', created_at: new Date().toISOString() },
  ];
  DB.set('visits', visits);

  const todos = [
    { id: DB.id(), customer_id: customers[0].id, title: 'サンプル送付（石材調シリーズ）', due: '2025-05-14', priority: 'high', done: false, created_at: new Date().toISOString() },
    { id: DB.id(), customer_id: customers[1].id, title: '大判タイル見積書を作成', due: '2025-05-16', priority: 'high', done: false, created_at: new Date().toISOString() },
    { id: DB.id(), customer_id: customers[2].id, title: '初回訪問アポ取り', due: '2025-05-15', priority: 'medium', done: false, created_at: new Date().toISOString() },
    { id: DB.id(), customer_id: null, title: '新商品カタログ補充', due: '2025-05-20', priority: 'low', done: true, created_at: new Date().toISOString() },
  ];
  DB.set('todos', todos);

// ===== NAVIGATION =====
let currentPage = 'dash';
let pageStack = [];

function navigate(page, params={}) {
  currentPage = page;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const navMap = { dash:'nav-dash', customers:'nav-customers', apo:'nav-apo', visits:'nav-visits', todos:'nav-todos' };
  const topPage = page.split('/')[0];
  if (navMap[topPage]) document.getElementById(navMap[topPage])?.classList.add('active');
  renderPage(page, params);
  window.scrollTo(0, 0);
}

function renderPage(page, params={}) {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'page';
  main.appendChild(div);
  const pages = {
    dash: renderDash, customers: renderCustomers,
    'customer/detail': renderCustomerDetail,
    'customer/new': renderCustomerNew,
    'customer/edit': renderCustomerEdit,
    apo: renderApo,
    'apo/new': renderApoNew,
    visits: renderVisits,
    'visit/new': renderVisitNew,
    todos: renderTodos,
  };
  if (pages[page]) pages[page](div, params);
}

// ===== DASHBOARD =====
function renderDash(el) {
  const customers = DB.get('customers');
  const todos = DB.get('todos');
  const visits = DB.get('visits');
  const today = new Date().toISOString().split('T')[0];
  const todayTodos = todos.filter(t => !t.done && t.due <= today);
  const upcoming = visits.filter(v => v.next_visit >= today).sort((a,b) => a.next_visit > b.next_visit ? 1 : -1);
  const overdue = todos.filter(t => !t.done && t.due < today);
  const priority = customers.filter(c => c.priority >= 4).sort((a,b) => b.priority - a.priority);

  el.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">TileCRM</div>
        <div class="page-subtitle">${formatDate(today)} · タイル営業</div>
      </div>
    </div>

    <div class="dash-scroll">
      <div class="stat-card">
        <div class="num" style="color:var(--red)">${todayTodos.length}</div>
        <div class="label">今日のタスク</div>
      </div>
      <div class="stat-card">
        <div class="num" style="color:var(--accent)">${upcoming.length}</div>
        <div class="label">次回訪問予定</div>
      </div>
      <div class="stat-card">
        <div class="num" style="color:var(--amber)">${overdue.length}</div>
        <div class="label">フォロー漏れ</div>
      </div>
      <div class="stat-card">
        <div class="num">${customers.length}</div>
        <div class="label">顧客数</div>
      </div>
    </div>

    ${todayTodos.length > 0 ? `
    <div class="section-label">今日やること</div>
    ${todayTodos.slice(0,3).map(t => renderTodoItem(t, customers)).join('')}
    ` : ''}

    ${upcoming.length > 0 ? `
    <div class="section-label">次回訪問予定</div>
    ${upcoming.slice(0,3).map(v => {
      const c = customers.find(c => c.id === v.customer_id);
      if (!c) return '';
      return `<div class="list-item" onclick="navigate('customer/detail',{id:'${c.id}'})">
        <div class="list-item-icon" style="background:var(--accent-bg)">📅</div>
        <div class="list-item-body">
          <div class="list-item-title">${c.company}</div>
          <div class="list-item-sub">${v.next_action || '次回アクション未設定'}</div>
        </div>
        <div class="list-item-right">
          <span class="badge badge-green" style="font-family:'DM Mono'">${v.next_visit}</span>
        </div>
      </div>`;
    }).join('')}
    ` : ''}

    ${overdue.length > 0 ? `
    <div class="section-label">⚠️ フォロー漏れ</div>
    ${overdue.slice(0,3).map(t => renderTodoItem(t, customers)).join('')}
    ` : ''}

    ${priority.length > 0 ? `
    <div class="section-label">優先顧客</div>
    ${priority.slice(0,4).map(c => {
      const lastVisit = DB.get('visits').filter(v => v.customer_id === c.id).sort((a,b) => b.visited_at > a.visited_at ? 1 : -1)[0];
      return `<div class="list-item" onclick="navigate('customer/detail',{id:'${c.id}'})">
        <div class="list-item-icon" style="background:var(--accent-bg)">🏢</div>
        <div class="list-item-body">
          <div class="list-item-title">${c.company}</div>
          <div class="list-item-sub">${lastVisit ? '最終訪問: ' + lastVisit.visited_at : '未訪問'}</div>
        </div>
        <div class="list-item-right">
          <span class="stars">${'★'.repeat(c.priority)}</span>
          <span class="badge ${statusBadge(c.status)}">${c.status}</span>
        </div>
      </div>`;
    }).join('')}
    ` : ''}
  `;
}

function renderTodoItem(t, customers) {
  const c = t.customer_id ? customers.find(c => c.id === t.customer_id) : null;
  const today = new Date().toISOString().split('T')[0];
  const isOverdue = t.due && t.due < today && !t.done;
  return `<div class="todo-item ${t.done?'done':''}" onclick="toggleTodo('${t.id}')">
    <div class="todo-check"></div>
    <div class="todo-body">
      <div class="todo-title">${t.title}</div>
      <div class="todo-meta">
        ${t.due ? `<span class="todo-due ${isOverdue?'overdue':''}">${isOverdue?'⚠️ ':''} ${t.due}</span>` : ''}
        ${c ? `<span class="badge badge-blue">${c.company}</span>` : ''}
        ${t.priority === 'high' ? `<span class="badge badge-red">高</span>` : t.priority === 'medium' ? `<span class="badge badge-amber">中</span>` : `<span class="badge badge-gray">低</span>`}
      </div>
    </div>
  </div>`;
}

      </div>
      ${filtered.length === 0 ? `<div class="empty-state"><div class="icon">🏢</div><p>顧客がいません</p></div>` :
        filtered.map(c => {
          const visits = DB.get('visits').filter(v => v.customer_id === c.id);
          const last = visits.sort((a,b) => b.visited_at > a.visited_at ? 1 : -1)[0];
          return `<div class="list-item" onclick="navigate('customer/detail',{id:'${c.id}'})">

  render();

      </div>

        訪問履歴 <button class="btn-sm" onclick="navigate('visit/new',{customer_id:'${c.id}'})">＋記録</button>
      </div>
      ${visits.length === 0 ? `<div class="empty-state" style="padding:20px"><div class="icon">📋</div><p>訪問履歴がありません</p></div>` :
        `<div class="timeline">${visits.map((v, i) => `
          <div class="timeline-item">
            ${i < visits.length-1 ? '<div class="timeline-line"></div>' : ''}
            <div class="timeline-dot">📋</div>
            <div class="timeline-content">
              <div class="timeline-date">${v.visited_at}</div>

              ${v.next_action ? `<div class="timeline-action">→ ${v.next_action}</div>` : ''}
              ${v.next_visit ? `<div class="timeline-next">📅 次回訪問: ${v.next_visit}</div>` : ''}
              ${v.ai_suggestion ? `<div style="margin-top:8px;padding:8px;background:var(--accent-bg);border-radius:6px;font-size:12px;color:var(--accent)">🤖 ${v.ai_suggestion}</div>` : ''}

          <span style="font-size:13px;font-weight:500">次回提案アドバイス</span>
        </div>
        <div id="ai-text" class="ai-text">
          <div class="ai-loading dot-loader">
            <span></span><span></span><span></span>
          </div>
        </div>
        <button class="btn-sm" style="margin-top:10px" onclick="generateAI('${c.id}')">再生成</button>
      </div>` : ''}
    </div>
    <div style="height:30px"></div>
  `;

  if (visits.length > 0) generateAI(id);

    const cust = DB.get('customers').find(c => c.id === cid);
    const vs = DB.get('visits').filter(v => v.customer_id === cid).sort((a,b) => b.visited_at > a.visited_at ? 1 : -1).slice(0,3);
    const aiEl = document.getElementById('ai-text');
    if (!aiEl) return;
    aiEl.innerHTML = '<div class="ai-loading dot-loader"><span></span><span></span><span></span></div>';

顧客: ${cust.company}（${cust.industry}）
担当: ${cust.contact}
直近の訪問内容:
${vs.map(v => `- ${v.visited_at}: ${v.content}${v.next_action ? ' / 次のアクション: '+v.next_action : ''}`).join('\n')}

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 500,
          messages: [{ role: 'user', content: prompt }]
        })
      });
      const data = await res.json();
      const text = data.content?.find(b => b.type === 'text')?.text || 'AIの応答を取得できませんでした。';
      if (aiEl) aiEl.innerHTML = text.replace(/\n/g, '<br>');

      // save to latest visit
      const vsAll = DB.get('visits');
      const latestIdx = vsAll.findIndex(v => v.id === vs[0].id);
      if (latestIdx !== -1) { vsAll[latestIdx].ai_suggestion = text; DB.set('visits', vsAll); }
    } catch(e) {
      if (aiEl) aiEl.innerHTML = 'AI提案の取得に失敗しました。インターネット接続を確認してください。';
    }
  };
}

    navigate('customers');
  };
}

      <div class="tabs">
        ${['all','A','B','アポ済み'].map(s => `<div class="tab ${filter===s?'active':''}" onclick="apoFilter('${s}')">${s==='all'?'すべて':s==='A'?'Aランク':s==='B'?'Bランク':'アポ済み'}</div>`).join('')}
      </div>
      ${filtered.length === 0 ? `<div class="empty-state"><div class="icon">📋</div><p>リストが空です</p></div>` :
        filtered.map((a, i) => `
          <div class="apo-item" onclick="openApoDetail('${a.id}')">
            <div class="apo-rank" style="${a.priority==='A'?'background:var(--red-bg);color:var(--red)':a.priority==='B'?'background:var(--amber-bg);color:var(--amber)':'background:var(--border);color:var(--text2)'}">${a.priority}</div>
            <div class="apo-body">
              <div class="apo-company">${a.company}</div>
              <div class="apo-address">${a.address}</div>
              <div class="apo-tags">
                <span class="badge badge-gray">${a.industry}</span>
                <span class="badge ${a.status==='アポ済み'?'badge-green':'badge-blue'}">${a.status}</span>
                <span class="badge badge-gray">${a.source}</span>
              </div>
              ${a.note ? `<div class="apo-note">${a.note}</div>` : ''}
            </div>
          </div>`).join('')
      }
      <div style="height:24px"></div>
    `;
  }
  window.apoFilter = function(s) { filter = s; render(); };
  window.openApoDetail = function(aid) {
    const a = DB.get('apos').find(a => a.id === aid);
    if (!a) return;
    openModal(`
      <div class="modal-header">
        <div class="modal-title">${a.company}</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div style="padding:16px">
        <div class="card"><div class="card-body">
          <div class="info-row"><div class="info-label">業種</div><div class="info-value">${a.industry}</div></div>
          <div class="info-row"><div class="info-label">住所</div><div class="info-value">${a.address}</div></div>
          <div class="info-row"><div class="info-label">電話</div><div class="info-value"><a href="tel:${a.phone}">${a.phone}</a></div></div>
          <div class="info-row"><div class="info-label">優先度</div><div class="info-value"><span class="badge ${a.priority==='A'?'badge-red':a.priority==='B'?'badge-amber':'badge-gray'}">${a.priority}ランク</span></div></div>
          <div class="info-row"><div class="info-label">ステータス</div><div class="info-value"><span class="badge ${a.status==='アポ済み'?'badge-green':'badge-blue'}">${a.status}</span></div></div>
          <div class="info-row"><div class="info-label">情報源</div><div class="info-value">${a.source}</div></div>
          ${a.note ? `<div class="info-row"><div class="info-label">メモ</div><div class="info-value">${a.note}</div></div>` : ''}
        </div></div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn-sm" style="flex:1;text-align:center;padding:10px" onclick="apoToCustomer('${a.id}')">顧客に昇格</button>
          <button class="btn-sm" style="flex:1;text-align:center;padding:10px;background:var(--green-bg);color:var(--green)" onclick="apoMarkDone('${a.id}')">アポ済みにする</button>
        </div>
        <button style="width:100%;text-align:center;padding:10px;margin-top:8px;color:var(--red);font-size:13px" onclick="deleteApo('${a.id}')">削除する</button>
      </div>
    `);
  };
  window.apoMarkDone = function(aid) {
    const apos = DB.get('apos');
    const i = apos.findIndex(a => a.id === aid);
    if (i !== -1) { apos[i].status = 'アポ済み'; DB.set('apos', apos); }
    closeModal(); render();
  };
  window.apoToCustomer = function(aid) {
    const a = DB.get('apos').find(a => a.id === aid);
    closeModal();
    navigate('customer/new');
    setTimeout(() => {
      document.getElementById('f-company').value = a.company;
      document.getElementById('f-aisheet').value = a.note || '';
    }, 100);
  };
  window.deleteApo = function(aid) {
    if (!confirm('このリストから削除しますか？')) return;
    DB.set('apos', DB.get('apos').filter(a => a.id !== aid));
    closeModal(); render();
  };
  render();
}

function renderApoNew(el) {
  el.innerHTML = `
    <div class="detail-back" onclick="navigate('apo')">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> アポリスト
    </div>
    <div style="padding:8px 16px 20px"><div class="page-title">新規アポ先を追加</div></div>
    <div class="form-group">
      <label class="form-label">会社名 <span>*</span></label>
      <input class="form-control" id="fa-company" placeholder="例: 株式会社◯◯建設">
    </div>
    <div class="form-group">
      <label class="form-label">住所</label>
      <input class="form-control" id="fa-address" placeholder="例: 東京都新宿区...">
    </div>
    <div class="form-group">
      <label class="form-label">業種</label>
      <select class="form-control" id="fa-industry">
        ${['建設業','住宅・不動産','ホテル・宿泊','設計事務所','工務店','ゼネコン','その他'].map(s => `<option>${s}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">電話番号</label>
      <input class="form-control" id="fa-phone" type="tel" placeholder="例: 03-xxxx-xxxx">
    </div>
    <div class="form-group">
      <label class="form-label">優先度</label>
      <div class="toggle-group" id="fa-priority-group">
        <div class="toggle-btn active" data-val="A" onclick="selectPriority(this)">Aランク（最優先）</div>
        <div class="toggle-btn" data-val="B" onclick="selectPriority(this)">Bランク</div>
        <div class="toggle-btn" data-val="C" onclick="selectPriority(this)">Cランク</div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">情報源</label>
      <select class="form-control" id="fa-source">
        ${['Web調査','紹介','飛び込み予定','展示会','SNS','その他'].map(s=>`<option>${s}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">メモ・調査内容</label>
      <textarea class="form-control" id="fa-note" rows="3" placeholder="訪問前に調べた情報、アポイントのきっかけなど"></textarea>
    </div>
    <div style="padding:8px 16px 40px">
      <button class="btn-primary" style="width:100%;justify-content:center" onclick="saveApo()">追加する</button>
    </div>
  `;
  window.selectPriority = function(el) {
    document.querySelectorAll('#fa-priority-group .toggle-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  };
  window.saveApo = function() {
    const company = document.getElementById('fa-company').value.trim();
    if (!company) { alert('会社名は必須です'); return; }
    const priority = document.querySelector('#fa-priority-group .toggle-btn.active')?.dataset.val || 'B';
    const apos = DB.get('apos');
    apos.push({
      id: DB.id(), company,
      address: document.getElementById('fa-address').value,
      industry: document.getElementById('fa-industry').value,
      phone: document.getElementById('fa-phone').value,
      priority, status: '未訪問',
      source: document.getElementById('fa-source').value,
      note: document.getElementById('fa-note').value,
      created_at: new Date().toISOString()
    });
    DB.set('apos', apos);
    navigate('apo');
  };
}

// ===== VISITS =====
function renderVisits(el) {
  const visits = DB.get('visits').sort((a,b) => b.visited_at > a.visited_at ? 1 : -1);
  const customers = DB.get('customers');
  el.innerHTML = `
    <div class="page-header">
      <div><div class="page-title">訪問履歴</div><div class="page-subtitle">${visits.length}件</div></div>
      <button class="btn-icon" onclick="navigate('visit/new',{})"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    ${visits.length === 0 ? `<div class="empty-state"><div class="icon">📅</div><p>訪問履歴がありません</p></div>` :
      visits.map(v => {
        const c = customers.find(c => c.id === v.customer_id);
        return `<div class="list-item" onclick="navigate('customer/detail',{id:'${v.customer_id}'})">
          <div class="list-item-icon" style="background:var(--amber-bg)">📋</div>
          <div class="list-item-body">
            <div class="list-item-title">${c?.company || '不明'}</div>
            <div class="list-item-sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">${v.content}</div>
          </div>
          <div class="list-item-right">
            <span style="font-size:11px;color:var(--text3);font-family:'DM Mono'">${v.visited_at}</span>
            ${v.next_visit ? `<span class="badge badge-green" style="font-size:10px">次回 ${v.next_visit}</span>` : ''}
          </div>
        </div>`;
      }).join('')
    }
    <div style="height:24px"></div>
  `;
}

function renderVisitNew(el, {customer_id}) {
  const customers = DB.get('customers');
  el.innerHTML = `
    <div class="detail-back" onclick="navigate(${customer_id?`'customer/detail',{id:'${customer_id}'}`:'\'visits\''})">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> 戻る
    </div>
    <div style="padding:8px 16px 20px"><div class="page-title">訪問を記録する</div></div>
    <div class="form-group">
      <label class="form-label">顧客 <span>*</span></label>
      <select class="form-control" id="fv-customer">
        <option value="">選択してください</option>
        ${customers.map(c => `<option value="${c.id}" ${c.id===customer_id?'selected':''}>${c.company}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">訪問日 <span>*</span></label>
      <input class="form-control" id="fv-date" type="date" value="${new Date().toISOString().split('T')[0]}">
    </div>
    <div class="form-group">
      <label class="form-label">打合せ内容 <span>*</span></label>
      <textarea class="form-control" id="fv-content" rows="5" placeholder="話した内容、反応、気になった点など何でも書いてください"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">次回アクション</label>
      <input class="form-control" id="fv-action" placeholder="例: サンプルを送付する">
    </div>
    <div class="form-group">
      <label class="form-label">次回訪問予定日</label>
      <input class="form-control" id="fv-next" type="date">
    </div>
    <div style="padding:8px 16px 40px">
      <button class="btn-primary" style="width:100%;justify-content:center" onclick="saveVisit()">記録する</button>
    </div>
  `;
  window.saveVisit = function() {
    const cid = document.getElementById('fv-customer').value;
    const content = document.getElementById('fv-content').value.trim();
    if (!cid) { alert('顧客を選択してください'); return; }
    if (!content) { alert('打合せ内容を入力してください'); return; }
    const visits = DB.get('visits');
    const newV = {
      id: DB.id(), customer_id: cid,
      visited_at: document.getElementById('fv-date').value,
      content, next_action: document.getElementById('fv-action').value,
      next_visit: document.getElementById('fv-next').value,
      created_at: new Date().toISOString()
    };
    visits.push(newV);
    DB.set('visits', visits);
    navigate('customer/detail', {id: cid});
  };
}

// ===== TODOS =====
function renderTodos(el) {
  const todos = DB.get('todos').sort((a,b) => (a.due||'9999') > (b.due||'9999') ? 1 : -1);
  const customers = DB.get('customers');
  const today = new Date().toISOString().split('T')[0];
  let filter = 'pending';

  function render() {
    const filtered = todos.filter(t => filter === 'all' ? true : filter === 'done' ? t.done : !t.done);
    el.innerHTML = `
      <div class="page-header">
        <div><div class="page-title">ToDo</div></div>
        <button class="btn-icon" onclick="openTodoModal(null)"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      </div>
      <div class="tabs">
        ${[['pending','未完了'],['done','完了済み'],['all','すべて']].map(([v,l]) => `<div class="tab ${filter===v?'active':''}" onclick="todoFilter('${v}')">${l}</div>`).join('')}
      </div>
      ${filtered.length === 0 ? `<div class="empty-state"><div class="icon">✅</div><p>${filter==='done'?'完了したタスクがありません':'タスクが全て完了しています！'}</p></div>` :
        filtered.map(t => renderTodoItem(t, customers)).join('')
      }
      <div style="height:24px"></div>
    `;
  }
  window.todoFilter = function(f) { filter = f; render(); };
  render();
}

window.toggleTodo = function(id) {
  const todos = DB.get('todos');
  const i = todos.findIndex(t => t.id === id);
  if (i !== -1) { todos[i].done = !todos[i].done; DB.set('todos', todos); }
  renderPage(currentPage);
};

// ===== TODO MODAL =====
window.openTodoModal = function(customerId) {
  const customers = DB.get('customers');
  openModal(`
    <div class="modal-header">
      <div class="modal-title">ToDoを追加</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div style="padding:16px 0">
      <div class="form-group">
        <label class="form-label">タスク名 <span>*</span></label>
        <input class="form-control" id="mt-title" placeholder="例: サンプルを送付する">
      </div>
      <div class="form-group">
        <label class="form-label">期限日</label>
        <input class="form-control" id="mt-due" type="date">
      </div>
      <div class="form-group">
        <label class="form-label">関連顧客</label>
        <select class="form-control" id="mt-customer">
          <option value="">なし</option>
          ${customers.map(c => `<option value="${c.id}" ${c.id===customerId?'selected':''}>${c.company}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">優先度</label>
        <select class="form-control" id="mt-priority">
          <option value="high">高</option>
          <option value="medium" selected>中</option>
          <option value="low">低</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-primary" onclick="saveTodo()">追加する</button>
    </div>
  `);
};

window.saveTodo = function() {
  const title = document.getElementById('mt-title').value.trim();
  if (!title) { alert('タスク名を入力してください'); return; }
  const todos = DB.get('todos');
  todos.push({
    id: DB.id(), title,
    due: document.getElementById('mt-due').value,
    customer_id: document.getElementById('mt-customer').value || null,
    priority: document.getElementById('mt-priority').value,
    done: false, created_at: new Date().toISOString()
  });
  DB.set('todos', todos);
  closeModal();
  renderPage(currentPage);
};

// ===== MODAL =====
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }

// ===== UTILS =====
function statusBadge(s) {
  return s === '商談中' ? 'badge-blue' : s === '成約' ? 'badge-green' : s === '休眠' ? 'badge-gray' : 'badge-amber';
}
function formatDate(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;
}

// Init
navigate('dash');
</script>
